name: sitespeed.io
on:
  push:
    branches:
      - main
      - "3.*"
      - "*sitespeed*"
  workflow_dispatch:
    inputs:
      version:
        type: choice
        required: true
        default: main
        options:
          - main
          - "3.6"
          - "3.7"
          - "3.8"
          - all
      build-from-source:
        type: boolean
        default: false
jobs:
  run-sitespeed:
    name: Run sitespeed.io
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    env: &sitespeed-env
      TARGET_BRANCH: ${{ matrix.branch || github.ref_name }}
      MAAS_DOMAIN: localhost
      MAAS_URL: http://localhost:5240
    steps: &sitespeed-steps
      - uses: actions/checkout@main
        with:
          ref: ${{ matrix.branch && format('refs/heads/{0}', matrix.branch) || github.sha }}
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Build production UI
        run: yarn build
      - name: Setup MAAS
        uses: canonical/setup-maas@main
        with:
          branch: ${{ contains(env.TARGET_BRANCH, 'sitespeed') && 'main' || env.TARGET_BRANCH }}
          build-from-source: ${{ inputs.build-from-source || false }}
          maas-url: ${{ env.MAAS_URL }}/MAAS
          use-maasdb-dump: true
          maasdb-dump-url: https://github.com/canonical/maas-ui-testing/raw/main/db/maasdb-${{ (env.TARGET_BRANCH == '3.6' || env.TARGET_BRANCH == '3.7') && '24.04' || '26.04' }}-master-1000.dump
      - name: Create MAAS admin
        run: lxc exec maas-backend -- maas createadmin --username=admin --password=test --email=fake@example.org
      - name: Login MAAS admin
        run: |
          API_KEY=$(lxc exec maas-backend -- maas apikey --username=admin)
          lxc exec maas-backend -- maas login admin http://localhost:5240/MAAS "$API_KEY"
      - name: Wait for MAAS boot resources
        shell: bash
        run: while [ $(lxc exec maas-backend -- maas admin boot-resources is-importing | cat) == "true" ]; do sleep 10; done; echo "syncing finished"
      - name: Serve production UI
        env:
          NODE_ENV: production
          STATIC_DEMO: "true"
        run: node scripts/proxy.js > sitespeed.io/ui.log 2>&1 &
      - name: Wait for production UI
        run: yarn wait-on-ui --timeout 120000
      - name: Run sitespeed.io tests
        run: yarn sitespeed:ci --browsertime.domain=${{env.MAAS_DOMAIN}} --browsertime.port=8400
      - name: Collect MAAS logs
        if: failure()
        shell: bash
        run: lxc exec maas-backend -- journalctl -u snap.maas.pebble.service --since="1 hour ago" > sitespeed.io/maas_logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.branch && format('maas_logs-{0}', matrix.branch) || 'maas_logs' }}
          path: |
            sitespeed.io/maas_logs.txt
            sitespeed.io/ui.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.branch && format('sitespeed.io-results-{0}', matrix.branch) || 'sitespeed.io-results' }}
          path: sitespeed.io/results

  run-sitespeed-versions:
    name: Run sitespeed.io (versions)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON((github.event_name == 'schedule' || inputs.version == 'all') && '["main", "3.6", "3.7", "3.8"]' || format('["{0}"]', inputs.version || github.ref_name)) }}
    env: *sitespeed-env
    steps: *sitespeed-steps
