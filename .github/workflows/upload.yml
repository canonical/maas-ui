name: Build upload
on:
  push:
    branches:
      - main
      - "3.*"
  workflow_call:
    inputs:
      version:
        type: string
        default: ""
    secrets:
      UPLOAD_ASSETS_API_TOKEN:
        required: false
jobs:
  upload-build:
    if: github.repository_owner == 'canonical'
    name: Upload build artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version && format('refs/heads/{0}', inputs.version) || github.sha }}
      - name: Set build metadata
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "PACKAGE_NAME=maas_ui_${COMMIT_SHA}.tgz" >> "$GITHUB_ENV"
          echo "VITE_APP_GIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"
      - name: Restore node_modules
        id: yarn-cache
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Install
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: CYPRESS_INSTALL_BINARY=0 yarn install
      - name: Build
        run: yarn build
        env:
          CI: false
      - name: Compress
        run: cd build && tar -czf ../${{env.PACKAGE_NAME}} ./ && ls -hs ../${{env.PACKAGE_NAME}}
      - name: Install upload-assets snap
        run: sudo snap install upload-assets
      - name: Upload to assets server
        run: upload-assets --url-path ${{env.PACKAGE_NAME}} ${{env.PACKAGE_NAME}}
        env:
          UPLOAD_ASSETS_API_TOKEN: ${{secrets.UPLOAD_ASSETS_API_TOKEN}}
