name: Accessibility
on:
  push:
    branches:
      - main
      - "3.*"
      - "*a11y*"
  workflow_dispatch:
    inputs:
      version:
        type: choice
        required: true
        default: main
        options:
          - main
          - "3.6"
          - "3.7"
          - "3.8"
          - all
      build-from-source:
        type: boolean
        default: false
jobs:
  cypress-axe:
    name: cypress-axe
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(inputs.version == 'all' && '["main", "3.6", "3.7", "3.8"]' || format('["{0}"]', inputs.version || github.ref_name)) }}
    env:
      MAAS_URL: http://localhost:5240
      MAAS_UI_URL: http://localhost:8400
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/heads/{0}', matrix.branch) || github.sha }}
      - name: Setup MAAS
        uses: canonical/setup-maas@main
        with:
          branch: ${{ contains(matrix.branch, 'a11y') && 'main' || matrix.branch }}
          build-from-source: ${{ inputs.build-from-source || false }}
          maas-url: ${{env.MAAS_URL}}/MAAS
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Install Cypress
        uses: cypress-io/github-action@v7.3.0
        with:
          runTests: false
          install-command: yarn install
          build: yarn build
      - name: Create MAAS admin
        run: lxc exec maas-backend -- maas createadmin --username=admin --password=test --email=fake@example.org
      - name: Run cypress-axe accessibility tests
        uses: cypress-io/github-action@v7.3.0
        env:
          NODE_ENV: production
          STATIC_DEMO: "true"
        with:
          config: baseUrl=${{env.MAAS_UI_URL}},pageLoadTimeout=100000
          install: false
          start: node scripts/proxy.js
          spec: "cypress/e2e/accessibility/**/*.spec.ts"
          wait-on: "${{env.MAAS_UI_URL}}/MAAS/r/machines"
          wait-on-timeout: 120
