name: CI
on:
  push:
    branches:
      - main
      - "3.*"
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:
    inputs:
      version:
        type: choice
        required: true
        default: main
        options:
          - main
          - "3.6"
          - "3.7"
          - "3.8"
          - all
jobs:
  lint:
    name: Lint
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps: &lint-steps
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch && format('refs/heads/{0}', matrix.branch) || github.sha }}

      - name: Restore node_modules
        id: yarn-cache
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Install
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: CYPRESS_INSTALL_BINARY=0 yarn install
      - run: yarn lint

  test:
    name: Test
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps: &test-steps
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch && format('refs/heads/{0}', matrix.branch) || github.sha }}
      - name: Restore node_modules
        id: yarn-cache
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Install
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: CYPRESS_INSTALL_BINARY=0 yarn install
      - run: MEASURE_UNIT_PERFORMANCE=false yarn test
      - name: Upload timing logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.branch && format('test-timings-{0}', matrix.branch) || 'test-timings' }}
          path: test-timings.log

  build:
    name: Build
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps: &build-steps
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch && format('refs/heads/{0}', matrix.branch) || github.sha }}
      - name: Restore node_modules
        id: yarn-cache
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Install
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: CYPRESS_INSTALL_BINARY=0 yarn install
      - name: Build assets
        run: yarn build
      - name: Serve build
        run: yarn serve --host --port=8400 --base=/ &
      - name: Wait for UI to be ready
        run: yarn wait-on-ui

  lint-versions:
    name: Lint (versions)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    strategy: &version-matrix
      fail-fast: false
      matrix:
        branch: ${{ fromJSON((github.event_name == 'schedule' || inputs.version == 'all') && '["main", "3.6", "3.7", "3.8"]' || format('["{0}"]', inputs.version || github.ref_name)) }}
    steps: *lint-steps

  test-versions:
    name: Test (versions)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    strategy: *version-matrix
    steps: *test-steps

  build-versions:
    name: Build (versions)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    strategy: *version-matrix
    steps: *build-steps
